name: update flake.lock

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Not GITHUB_TOKEN: pushes and PRs made with it trigger no workflow, so pr-build would not run.
      GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Update flake.lock and open the PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # An open PR keeps its branch, fix-up commits included: never rewrite it from main.
          pr=$(gh pr list --head update-flake-lock --base main --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            git fetch origin update-flake-lock:update-flake-lock
            git switch update-flake-lock
          else
            git switch -c update-flake-lock
          fi

          nix flake update 2> update.log || { cat update.log; exit 1; }
          cat update.log
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged"
            exit 0
          fi

          git commit -m "flake.lock: update" -m "$(grep -v '^warning:' update.log || true)" flake.lock
          if [ -n "$pr" ]; then
            git push origin update-flake-lock
          else
            # No open PR: whatever the branch holds is a leftover of a merged or closed one.
            git push --force origin update-flake-lock
            gh pr create --base main --head update-flake-lock --title "flake.lock: update" \
              --body "Weekly \`nix flake update\`. The \`pr-build\` workflow posts the build report and package diff."
          fi
