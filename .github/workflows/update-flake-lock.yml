name: update flake.lock

on:
  schedule:
    - cron: "0 3 * * 1" # lundi 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Les deux toplevels de srv-1 pèsent ~12 Gio décompressés : le runner n'a pas la place
      # sans retirer ses toolchains préinstallées.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          # catppuccin.cachix.org évite de rebuilder whiskers (import-from-derivation à l'éval).
          extra_nix_config: |
            extra-substituters = https://catppuccin.cachix.org
            extra-trusted-public-keys = catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=

      # Builder plutôt que comparer les .drv : dix sur des .drv compare le closure de build
      # (patchs, tarballs, bootstrap), pas ce qui tourne sur srv-1.
      - name: Build current srv-1
        run: nix build .#nixosConfigurations.srv-1.config.system.build.toplevel --out-link old

      - name: Update flake.lock
        id: update
        run: |
          nix flake update 2> update.log || { cat update.log; exit 1; }
          cat update.log
          # Rien n'a bougé : pas de build, et la PR existante reste telle quelle.
          if git diff --quiet flake.lock; then echo changed=false; else echo changed=true; fi >> "$GITHUB_OUTPUT"

      - name: Build updated srv-1
        if: steps.update.outputs.changed == 'true'
        run: nix build .#nixosConfigurations.srv-1.config.system.build.toplevel --out-link new

      - name: Write PR body
        if: steps.update.outputs.changed == 'true'
        run: |
          nix run --inputs-from . nixpkgs#dix -- --color never old new > dix.txt
          cat dix.txt
          {
            echo '## Changements sur srv-1'
            echo
            echo '```'
            # Limite GitHub : 65 536 caractères pour le corps de PR.
            head -c 60000 dix.txt
            if [ "$(wc -c < dix.txt)" -gt 60000 ]; then
              echo
              echo '… tronqué, sortie complète dans les logs du run'
            fi
            echo '```'
            echo
            echo '## Inputs'
            echo
            echo '```'
            grep -v '^warning:' update.log || true
            echo '```'
            echo
            echo "Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > pr-body.md

      - if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update-flake-lock
          base: main
          title: "flake.lock: update"
          commit-message: "flake.lock: update"
          add-paths: flake.lock
          body-path: pr-body.md
          delete-branch: true
