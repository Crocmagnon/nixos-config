[tasks.flake-update]
description = "update flake.lock"
run = "nix flake update"

[tasks.all]
description = "deploy to all machines"
run = [
  { task = "localhost" },
  { task = "srv-1" },
]

[tasks.localhost]
description = "deploy to local machine"
run = "nh os switch .#"

[tasks.srv-1]
description = "deploy to server: srv-1 fetches the pushed main from Codeberg and switches itself"
# Built and switched on srv-1 itself: the desktops run Arch, without nix. Only what is pushed gets
# deployed, hence the check for unpushed commits.
run = [
  "test -z \"$(git log --oneline @{u}..)\" || { echo 'unpushed commits: git push first' >&2; exit 1; }",
  "ssh -t gaugendre@srv-1 sudo nixos-rebuild switch --refresh --flake 'git+https://codeberg.org/Crocmagnon/nixos-config?ref=main#srv-1'",
]

[tasks.initial-srv-1]
description = "initial deploy to server over debian"
run = "nix run github:nix-community/nixos-anywhere -- --flake .#srv-1 --generate-hardware-config nixos-generate-config ./srv-1/hardware-configuration.nix --target-host debian@54.36.111.79"
