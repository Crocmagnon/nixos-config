[tasks.flake-update]
description = "update flake.lock"
run = "nix flake update"

[tasks.all]
description = "deploy to all machines"
run = [
  { task = "localhost" },
  { task = "vps-3" },
]

[tasks.localhost]
description = "deploy to local machine"
run = "sudo nixos-rebuild -I nixos-config=./framework-gab/configuration.nix switch"

[tasks.vps-3]
description = "deploy flake to server"
run = "nixos-rebuild switch -I nixos-config=./vps-3/configuration.nix --target-host gaugendre@vps-3 --sudo"

