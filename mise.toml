[tasks.flake-update]
description = "update flake.lock"
run = "nix flake update"

[tasks.srv-1]
description = "deploy to server: srv-1 fetches the pushed current branch from GitHub and switches itself"
# Built and switched on srv-1 itself: the desktops run Arch, without nix. Only what is pushed gets
# deployed, hence the check for unpushed commits. The current branch is deployed, so a feature
# branch can be tried on the server before it is merged.
run = [
  "test -z \"$(git log --oneline @{u}..)\" || { echo 'unpushed commits: git push first' >&2; exit 1; }",
  "ref=$(git branch --show-current) && test -n \"$ref\" || { echo 'detached HEAD: check out a branch' >&2; exit 1; }; ssh -t gaugendre@srv-1 sudo nixos-rebuild switch --refresh --flake \"git+https://github.com/Crocmagnon/nixos-config?ref=$ref#srv-1\"",
]

[tasks.initial-srv-1]
description = "initial deploy to server over debian"
run = "nix run github:nix-community/nixos-anywhere -- --flake .#srv-1 --generate-hardware-config nixos-generate-config ./srv-1/hardware-configuration.nix --target-host debian@54.36.111.79"
