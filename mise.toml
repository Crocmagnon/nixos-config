[tasks.flake-update]
description = "update flake.lock"
run = "nix flake update"

[tasks.deploy]
description = "deploy flake to server"
run = "nixos-rebuild switch --flake .#vps-3 --target-host gaugendre@vps-3 --sudo"

[tasks.redeploy]
description = "fully redeploy to server over existing nixos"
run = "nix run github:nix-community/nixos-anywhere -- --flake .#vps-3 --generate-hardware-config nixos-facter ./vps/facter.json --target-host root@vps-3.augendre.info"

[tasks.initial-deploy]
description = "initial deploy to server over debian"
run = "nix run github:nix-community/nixos-anywhere -- --flake .#vps-3 --generate-hardware-config nixos-facter ./vps/facter.json --target-host debian@vps-3.augendre.info"
